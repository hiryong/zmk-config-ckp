on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_reset:
        description: 'Build settings_reset firmware?'
        required: false
        default: 'false'

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('manifest-dir/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr export
        run: west zephyr-export

      # ✅ 일반 bt60 펌웨어
      - name: West Build (bt60)
        run: west build -s zmk/app -b bt60 -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename zmk.uf2 (bt60)
        run: cp build/zephyr/zmk.uf2 bt60.uf2

      - name: Archive (bt60)
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bt60.uf2

      # ✅ 선택적: settings_reset 펌웨어
      - name: Clean build folder
        if: github.event.inputs.build_reset == 'true'
        run: rm -rf build

      - name: West Build (settings_reset)
        if: github.event.inputs.build_reset == 'true'
        run: west build -s zmk/app -b bt60 -- -DSHIELD=settings_reset -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename zmk.uf2 (settings_reset)
        if: github.event.inputs.build_reset == 'true'
        run: cp build/zephyr/zmk.uf2 settings_reset.uf2

      - name: Archive (settings_reset)
        if: github.event.inputs.build_reset == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: settings_reset
          path: settings_reset.uf2
